name: CoupleFinance
options:
  bundleIdPrefix: com.anassaidi
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 3
    DEVELOPMENT_TEAM: 6BA3YQ63RC
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Couple Finance
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  CoupleFinance:
    type: application
    platform: iOS
    sources: [CoupleFinance]
    info:
      path: Configuration/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.anassaidi.couplefinance.shortcuts
            CFBundleURLSchemes: [couplefinance]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anassaidi.couplefinance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CoupleFinanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CoupleFinance
  CoupleFinanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CoupleFinance
schemes:
  CoupleFinance:
    build:
      targets:
        CoupleFinance: all
    test:
      targets: [CoupleFinanceTests, CoupleFinanceUITests]
